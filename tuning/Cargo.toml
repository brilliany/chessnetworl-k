[package]
name = "chessnetwork-tuning"
version = "0.1.0"
edition = "2021"

[dependencies]
chessnetwork-core = { path = "../core" }

rand = "0.8"
rand_distr = "0.4"
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "tuner"
path = "src/main.rs"

[lib]
path = "src/lib.rs"